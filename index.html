.bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center, rgba(255,230,214,.35), rgba(255,230,214,0) 70%)}
.app{
  position:relative;z-index:1;height:100%;display:flex;flex-direction:column;
  padding-block:14px;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
}
.board{
  flex:1;min-height:0;display:flex;flex-direction:column;
  max-width:1360px;width:100%;margin:0 auto;
  background:rgba(255,246,238,.88);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  border:3px solid var(--bark);border-radius:28px;
  box-shadow:0 6px 0 var(--bark);
  overflow:hidden;
}
header{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:14px 20px 12px;border-bottom:2px dashed var(--line);
}
.brand{display:flex;flex-direction:column;line-height:1.05;margin-right:auto}
.brand small{font-family:var(--font-display);color:var(--bark-soft);font-size:14px;letter-spacing:.02em}
.brand b{font-family:var(--font-display);font-weight:400;font-size:28px;color:var(--leaf)}
.brand b span{color:var(--orange)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{
  font-family:var(--font-display);font-size:22px;color:var(--bark);
  background:var(--paper);border:2px solid var(--bark);border-radius:999px;
  padding:9px 16px;cursor:pointer;box-shadow:0 3px 0 var(--bark);
  transition:transform .08s, box-shadow .08s;
}
.tab:active{transform:translateY(3px);box-shadow:0 0 0 var(--bark)}
.tab[aria-selected="true"]{background:var(--orange);color:#fff;border-color:var(--orange-deep);box-shadow:0 3px 0 var(--orange-deep)}
.tab{display:inline-flex;align-items:center;gap:8px}
.tab .n{display:inline-grid;place-items:center;min-width:34px;height:30px;padding:0 8px;border-radius:999px;background:var(--bark);color:#fff;font-size:20px;font-variant-numeric:tabular-nums;line-height:1}
.tab[aria-selected="true"] .n{background:#fff;color:var(--orange-deep)}
.hdr-tools{display:flex;align-items:center;gap:8px;flex:none}
.fs-btn{
  display:inline-flex;align-items:center;gap:6px;font-family:var(--font-display);font-size:17px;color:var(--bark);
  background:var(--mustard);border:2px solid var(--bark);border-radius:999px;padding:7px 14px;cursor:pointer;
  box-shadow:0 3px 0 var(--bark);transition:transform .06s,box-shadow .06s;
}
.fs-btn:active{transform:translateY(3px);box-shadow:none}
.fs-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.fs-btn:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.admin-btn{
  font-family:var(--font-display);font-size:14px;color:var(--bark-soft);background:transparent;
  border:1.5px dashed var(--bark-soft);border-radius:999px;padding:6px 12px;cursor:pointer;
}
.admin-btn:focus-visible,.tab:focus-visible,.btn:focus-visible,.step:focus-visible{outline:3px solid var(--mustard);outline-offset:2px}

.scroll-wrap{flex:1;min-height:0;display:flex;position:relative}
main{flex:1;min-width:0;min-height:0;overflow-y:auto;padding:16px 8px 20px 20px;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior:contain}
main::-webkit-scrollbar{display:none}
.fade{position:absolute;left:0;right:64px;bottom:0;height:56px;pointer-events:none;background:linear-gradient(rgba(255,246,238,0),rgba(255,246,238,.95));transition:opacity .2s}
.fade b{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);font-family:var(--font-display);font-weight:400;font-size:16px;color:var(--bark);background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:3px 14px;white-space:nowrap}
.fade.gone{opacity:0}
.rail{width:64px;flex:none;display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 10px;border-left:2px dashed var(--line)}
.rail-btn{width:46px;height:46px;border-radius:14px;border:2px solid var(--bark);background:var(--mustard);color:var(--bark);font-size:20px;line-height:1;cursor:pointer;box-shadow:0 3px 0 var(--bark);display:grid;place-items:center;padding:0;transition:transform .06s,box-shadow .06s}
.rail-btn:active:not(:disabled){transform:translateY(3px);box-shadow:none}
.rail-btn:disabled{opacity:.3;cursor:default;box-shadow:none}
.rail-btn:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.track{flex:1;width:22px;position:relative;border-radius:999px;background:repeating-linear-gradient(180deg,#F1DCCB 0 10px,#F8E8DB 10px 20px);border:2px solid var(--line);cursor:pointer;touch-action:none}
.thumb{position:absolute;left:-4px;right:-4px;top:0;height:60px;border-radius:999px;background:var(--orange);border:2px solid var(--orange-deep);box-shadow:0 2px 0 var(--orange-deep);cursor:grab;touch-action:none}
.thumb::before{content:"";position:absolute;left:50%;top:50%;width:10px;height:14px;transform:translate(-50%,-50%);background:repeating-linear-gradient(180deg,rgba(255,255,255,.85) 0 2px,transparent 2px 6px)}
.thumb.drag{cursor:grabbing;background:var(--orange-deep)}
.rail.off .track,.rail.off .rail-btn{opacity:.3;pointer-events:none}
.section-label{
  font-family:var(--font-display);font-size:26px;color:var(--bark);
  margin:6px 2px 12px;display:flex;align-items:center;gap:10px;
}
.section-label::after{content:"";flex:1;height:2px;background:var(--line);border-radius:2px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:22px}
.card{
  background:var(--paper);border:2px solid var(--line);border-radius:18px;
  padding:18px 14px 16px;display:flex;flex-direction:column;gap:14px;min-width:0;
  transition:border-color .15s, box-shadow .15s;
}
.card.on{border-color:var(--orange);box-shadow:0 0 0 3px rgba(242,122,26,.18)}
.card .head{display:flex;flex-direction:column;gap:4px;min-height:84px}
.card .en{font-family:var(--font-display);font-size:22px;line-height:1.15;color:var(--ink);word-break:keep-all;overflow-wrap:anywhere}
.card .ko{font-size:17px;color:var(--bark-soft)}
.badge{
  align-self:flex-start;font-family:var(--font-display);font-size:13px;letter-spacing:.06em;
  border-radius:999px;padding:2px 8px;margin-top:3px;
}
.badge.ICE_ONLY{background:#E3ECF5;color:var(--ice)}
.badge.HOT_ONLY{background:#FBE2D8;color:var(--hot)}
.badge.DECAF{background:#E4EFE1;color:var(--leaf)}
.rows{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:50px 1fr;align-items:center;gap:8px}
.row .t{font-family:var(--font-display);font-size:16px;text-align:center;border-radius:10px;padding:5px 0;line-height:1.2}
.row .t.HOT{background:#FBE2D8;color:var(--hot)}
.row .t.ICE{background:#E3ECF5;color:var(--ice)}
.row .t.ONE{background:#F3E6DA;color:var(--bark)}
.row .t i{display:block;font-style:normal;font-size:14px;opacity:.8}
.stepper{display:grid;grid-template-columns:48px minmax(44px,1fr) 48px;align-items:center;gap:6px}
.step{
  height:54px;border-radius:14px;font-family:var(--font-display);font-size:30px;line-height:1;cursor:pointer;
  display:grid;place-items:center;padding:0;
  transition:transform .06s, box-shadow .06s;
}
.step.minus{background:var(--paper);color:var(--bark);border:2px solid var(--bark);box-shadow:0 3px 0 var(--bark)}
.step.plus{background:var(--orange);color:#fff;border:2px solid var(--orange-deep);box-shadow:0 3px 0 var(--orange-deep)}
.step:active:not(:disabled){transform:translateY(3px);box-shadow:none}
.step:disabled{opacity:.3;cursor:default;box-shadow:none}
.qty{
  font-family:var(--font-display);font-size:30px;text-align:center;font-variant-numeric:tabular-nums;
  background:#fff;border:2px solid var(--line);border-radius:12px;height:54px;display:grid;place-items:center;color:var(--ink)
}
.qty.pos{border-color:var(--orange);color:var(--orange-deep);background:#FFF1E4}

/* Order bar */
.bar{
  display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;
  padding:12px 20px;border-top:3px solid var(--bark);background:var(--paper);
}
.cart{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-width:0}
.cart-sum{font-family:var(--font-display);font-size:23px;color:var(--bark);font-variant-numeric:tabular-nums;white-space:nowrap}
.cart-sum b{font-weight:400;color:var(--orange-deep);font-size:30px}
.cart-sum .won{color:var(--leaf);margin-left:6px}
.btn{
  font-family:var(--font-display);font-size:19px;border-radius:14px;padding:10px 20px;cursor:pointer;
  border:2px solid var(--bark);background:var(--paper);color:var(--bark);box-shadow:0 3px 0 var(--bark);
  transition:transform .06s, box-shadow .06s;
}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:none}
.btn:disabled{opacity:.35;cursor:default}
.btn.go{background:var(--leaf);border-color:#3A6B37;color:#fff;box-shadow:0 3px 0 #3A6B37;font-size:22px;padding:10px 26px}
.btn.warn{background:var(--hot);border-color:#B8401C;color:#fff;box-shadow:0 3px 0 #B8401C}
.total{display:flex;align-items:center;gap:14px}
.total .left{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.total .lbl{font-family:var(--font-display);font-size:20px;color:var(--bark);line-height:1.2}
.remain-box{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:132px;padding:6px 16px;border-radius:18px;background:var(--leaf);color:#fff;border:2px solid #3A6B37;box-shadow:0 3px 0 #3A6B37;line-height:1.05}
.remain-box small{font-family:var(--font-display);font-size:16px;opacity:.9}
.remain-box b{font-family:var(--font-display);font-weight:400;font-size:42px;font-variant-numeric:tabular-nums}
.remain-box em{font-style:normal;font-family:var(--font-display);font-size:14px;opacity:.9;min-height:15px}
.remain-box.alert{background:var(--hot);border-color:#B8401C;box-shadow:0 3px 0 #B8401C}
.count{font-family:var(--font-display);font-size:46px;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.count span{color:var(--bark-soft);font-size:26px}
.meter{width:170px;height:16px;border-radius:999px;background:#F1DCCB;border:2px solid var(--bark);overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--mustard),var(--orange));width:0;transition:width .4s}
.meter.near i{background:linear-gradient(90deg,var(--orange),var(--hot))}

/* Overlays */
.overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:rgba(74,46,30,.45)}
.modal{
  background:var(--paper);border:3px solid var(--bark);border-radius:24px;box-shadow:0 6px 0 var(--bark);
  width:min(560px,100%);max-height:calc(100% - 20px);display:flex;flex-direction:column;overflow:hidden;
}
.modal.wide{width:min(1000px,100%)}
.modal h2{font-family:var(--font-display);font-weight:400;font-size:26px;color:var(--bark);margin:0;padding:18px 22px 10px;text-wrap:balance}
.modal .body{padding:4px 22px 12px;overflow-y:auto}
.modal .foot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding:12px 22px 18px;border-top:2px dashed var(--line)}
.lines{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.lines li{display:grid;grid-template-columns:1fr auto auto;gap:14px;padding:9px 0;border-bottom:1px solid var(--line);font-size:17px;align-items:baseline}
.lines li .q,.lines li .a{font-family:var(--font-display);font-variant-numeric:tabular-nums}
.lines li .a{min-width:84px;text-align:right}
.tag{font-family:var(--font-display);font-size:12px;border-radius:6px;padding:1px 6px;margin-left:6px}
.tag.HOT{background:#FBE2D8;color:var(--hot)}.tag.ICE{background:#E3ECF5;color:var(--ice)}
.sumline{display:flex;justify-content:space-between;font-family:var(--font-display);font-size:22px;padding:12px 0 2px;color:var(--ink)}
.sumline b{font-weight:400;color:var(--orange-deep)}

.soldout{position:fixed;inset:0;z-index:15;display:grid;place-items:center;background:rgba(255,230,214,.7);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.soldout .sign{
  text-align:center;background:var(--paper);border:4px solid var(--bark);border-radius:32px;box-shadow:0 8px 0 var(--bark);
  padding:36px 56px;transform:rotate(-2deg);
}
.soldout .sign b{display:block;font-family:var(--font-display);font-weight:400;font-size:clamp(56px,10vw,112px);color:var(--hot);line-height:1}
.soldout .sign p{font-family:var(--font-display);font-size:22px;color:var(--bark);margin:14px 0 0}
.soldout .admin-btn{margin-top:18px}

.pin{display:flex;flex-direction:column;align-items:center;gap:14px;padding:6px 0 4px}
.pin-dots{display:flex;gap:12px}
.pin-dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--bark);background:transparent}
.pin-dots i.f{background:var(--orange);border-color:var(--orange-deep)}
.pin-msg{min-height:20px;font-size:14px;color:var(--hot)}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:10px}
.keypad .btn{font-size:26px;padding:10px 0}

.report-top{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:4px 0 14px}
.stat{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 14px}
.stat small{font-size:13px;color:var(--bark-soft)}
.stat b{display:block;font-family:var(--font-display);font-weight:400;font-size:28px;font-variant-numeric:tabular-nums;color:var(--ink)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
thead th{font-family:var(--font-display);font-weight:400;color:var(--bark);background:#F8EADF;position:sticky;top:0}
tr.cat td{font-family:var(--font-display);background:#FFF1E4;color:var(--orange-deep)}
tr.zero td{color:#B9A396}
.subhead{font-family:var(--font-display);font-size:19px;color:var(--bark);margin:18px 0 8px}
.orders{font-size:14px}
.note{font-size:13px;color:var(--bark-soft);margin:6px 0 0}
.subhead small{font-family:var(--font-body);font-size:14px;color:var(--bark-soft);margin-left:8px}
th.ck,td.ck{width:52px;text-align:center!important;padding:6px 4px}
tr.pick{cursor:pointer}
.orders th:nth-child(3),.orders td:nth-child(3){text-align:left}
tr.pick.sel td{background:#FBE2D8}
.chk{display:inline-block;width:28px;height:28px;border-radius:8px;border:2.5px solid var(--bark);background:#fff;position:relative;vertical-align:middle}
.chk.on{background:var(--hot);border-color:#B8401C}
.chk.on::after{content:"";position:absolute;left:8px;top:3px;width:7px;height:13px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg)}
.xl-file{font-family:var(--font-display);font-size:18px;color:var(--leaf);background:#E4EFE1;border-radius:12px;padding:10px 14px;margin:2px 0 10px;word-break:break-all}
.xl-help{font-size:16px;line-height:1.55;color:var(--bark);margin:0 0 6px}
.csv-box{width:100%;height:120px;font-family:ui-monospace,Menlo,monospace;font-size:12px;border:2px solid var(--line);border-radius:10px;padding:8px;margin-top:8px;user-select:text;-webkit-user-select:text}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);z-index:40;background:var(--leaf);color:#fff;font-family:var(--font-display);font-size:22px;padding:12px 26px;border-radius:999px;box-shadow:0 4px 0 #3A6B37;pointer-events:none}

@media (max-width:1240px){
  header{gap:10px;padding:12px 16px 10px}
  .brand b{font-size:23px}.brand small{font-size:13px}
  .tab{font-size:19px;padding:8px 13px;gap:6px}.tab .n{min-width:30px;height:27px;font-size:18px}
  .fs-btn{padding:7px 10px}.fs-btn span{display:none}
}
@media (max-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:860px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.bar{grid-template-columns:1fr}.total{justify-content:space-between}}
@media (max-width:560px){
  .rail{width:48px;padding:10px 6px}.rail-btn{width:36px;height:36px}.fade{right:48px}
  .grid{grid-template-columns:minmax(0,1fr)}.remain-box b{font-size:32px}
  .brand b{font-size:22px}.tab{font-size:16px;padding:6px 12px}
  .meter{display:none}.count{font-size:32px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="bg" aria-hidden="true"></div>
<div class="app">
  <div class="board">
    <header>
      <div class="brand"><small>2026 펄밀리데이 · 10.24</small><b>숲에서 쉬어갈 <span>카페</span></b></div>
      <nav class="tabs" role="tablist" id="tabs"></nav>
      <div class="hdr-tools"><button class="fs-btn" id="fsBtn" type="button" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path id="fsIcon" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span id="fsLabel">전체화면</span></button>
      <button class="admin-btn" id="adminOpen" type="button">관리</button></div>
    </header>
    <div class="scroll-wrap">
      <main id="main"></main>
      <div class="fade gone" id="fade"><b>아래로 더 있어요 ▼</b></div>
      <div class="rail" id="rail">
        <button class="rail-btn" id="scrollUp" type="button" aria-label="위로">▲</button>
        <div class="track" id="track"><div class="thumb" id="thumb"></div></div>
        <button class="rail-btn" id="scrollDown" type="button" aria-label="아래로">▼</button>
      </div>
    </div>
    <div class="bar">
      <div class="cart">
        <div class="cart-sum" id="cartSum"></div>
        <button class="btn" id="clearCart" type="button">비우기</button>
        <button class="btn go" id="orderBtn" type="button">주문 완료</button>
      </div>
      <div class="total">
        <div class="left"><div class="lbl">음료 총 카운팅</div><div class="meter" id="meter"><i></i></div></div>
        <div class="count" id="count"></div>
        <div class="remain-box" id="remainBox"><small>남은 잔</small><b id="remain"></b><em id="remainAfter"></em></div>
      </div>
    </div>
  </div>
</div>

<div class="soldout" id="soldout" hidden>
  <div class="sign">
    <b>음료 마감</b>
    <p>준비한 800잔이 모두 나갔어요. 감사합니다!</p>
    <button class="admin-btn" id="adminOpen2" type="button">관리</button>
  </div>
</div>

<div class="overlay" id="confirm" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="cfTitle">
    <h2 id="cfTitle">이대로 주문할까요?</h2>
    <div class="body"><ul class="lines" id="cfLines"></ul><div class="sumline"><span id="cfQty"></span><b id="cfAmt"></b></div></div>
    <div class="foot"><button class="btn" id="cfCancel" type="button">다시 고르기</button><button class="btn go" id="cfOk" type="button">주문 확정</button></div>
  </div>
</div>

<div class="overlay" id="pinBox" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="pinTitle" style="width:min(340px,100%)">
    <h2 id="pinTitle">관리자 PIN</h2>
    <div class="body"><div class="pin"><div class="pin-dots" id="pinDots"><i></i><i></i><i></i><i></i></div><div class="pin-msg" id="pinMsg"></div><div class="keypad" id="keypad"></div></div></div>
    <div class="foot"><button class="btn" id="pinCancel" type="button">닫기</button></div>
  </div>
</div>

<div class="overlay" id="report" hidden>
  <div class="modal wide" role="dialog" aria-modal="true" aria-labelledby="rpTitle">
    <h2 id="rpTitle">정산</h2>
    <div class="body" id="rpBody"></div>
    <div class="foot">
      <button class="btn" id="rpCsv" type="button">엑셀 저장</button>
      <button class="btn warn" id="rpCancel" type="button" disabled>선택 주문 취소</button>
      <button class="btn warn" id="rpReset" type="button">전체 초기화</button>
      <button class="btn go" id="rpClose" type="button">닫기</button>
    </div>
  </div>
</div>

<div class="overlay" id="ask" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="askTitle" style="width:min(460px,100%)">
    <h2 id="askTitle"></h2>
    <div class="body"><p id="askText" style="font-size:17px;margin:4px 0 8px;line-height:1.5"></p></div>
    <div class="foot"><button class="btn" id="askNo" type="button">취소</button><button class="btn warn" id="askYes" type="button">확인</button></div>
  </div>
</div>

<div class="overlay" id="xlBox" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="xlTitle" style="width:min(520px,100%)">
    <h2 id="xlTitle">엑셀 파일 저장</h2>
    <div class="body">
      <p class="xl-file" id="xlName"></p>
      <p class="xl-help">메뉴별 집계와 주문 내역이 시트 2개로 들어 있어요.<span id="xlShareHelp"><br>다운로드 폴더에 안 보이면 <b>공유로 보내기</b>로 카카오톡·드라이브·내 파일에 저장하세요.</span></p>
    </div>
    <div class="foot"><button class="btn" id="xlClose" type="button">닫기</button><button class="btn" id="xlShare" type="button" hidden>공유로 보내기</button><button class="btn go" id="xlSave" type="button">다운로드 폴더에 저장</button></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script>
(function(){
const LIMIT = 800;
const PIN = "1234";
const STORE_KEY = "pearlday-kiosk-2026";
const CATS = ["COFFEE","DRINK","TEA","PET DRINK"];

// temp: BOTH | HOT_ONLY | ICE_ONLY | ONE ; price [hot, ice] or single
const MENU = [
  ["americano","COFFEE","AMERICANO","아메리카노","BOTH",[6500,6800]],
  ["caffe-latte","COFFEE","CAFFE LATTE","카페라떼","BOTH",[7000,7300]],
  ["cafe-mocha","COFFEE","CAFE MOCHA","카페모카","BOTH",[7500,7800]],
  ["cappuccino","COFFEE","CAPPUCCINO","카푸치노","HOT_ONLY",[7000]],
  ["cold-brew","COFFEE","COLD BREW","콜드브루","ONE",[6500],"DECAF"],
  ["cold-brew-latte","COFFEE","COLD BREW LATTE","콜드브루 라떼","ONE",[7500],"DECAF"],
  ["vanilla-latte","COFFEE","VANILLA CAFFE LATTE","바닐라 카페라떼","BOTH",[7500,7800]],
  ["condensed-latte","COFFEE","CONDENSED MILK LATTE","연유 카페라떼","BOTH",[8000,8300]],
  ["hazelnut-oat","COFFEE","HAZELNUTS OATS LATTE","헤이즐넛 오트라떼","BOTH",[8000,8300]],
  ["camp-choco","DRINK","CAMP CHOCOLATE","캠프 초콜릿","BOTH",[7500,7800]],
  ["jeju-matcha","DRINK","JEJU MATCHA LATTE","제주 말차 라떼","BOTH",[8000,8300]],
  ["strawberry","DRINK","STRAWBERRY LATTE","스트로베리 라떼","ICE_ONLY",[8500]],
  ["pear-yuzu","DRINK","NAJU PEAR YUZU SMOOTHIE","나주배 유자 스무디","ICE_ONLY",[8000]],
  ["persimmon","DRINK","SOFT PERSIMMON BLENDED","홍시 블렌디드","ICE_ONLY",[8000]],
  ["hoji-matcha","DRINK","HOJI & MATCHA FOREST","호지 말차 포레스트","ICE_ONLY",[8500]],
  ["citron-ade","DRINK","CITRON GRAPEFRUIT ADE","유자 자몽 에이드","ICE_ONLY",[8000]],
  ["lemon-basil","DRINK","LEMON BASIL ADE","레몬 바질 에이드","ICE_ONLY",[8500]],
  ["apple-chaud","DRINK","APPLE VIN CHADU ADE","애플 뱅쇼 에이드","ICE_ONLY",[8500]],
  ["apple-citron","TEA","APPLE CITRION TEA","애플 유자티","BOTH",[8000,8300]],
  ["earlgrey","TEA","EARLGREY GRAPEFRUIT TEA","얼그레이 자몽티","BOTH",[8000,8300]],
  ["chamomile","TEA","CHAMOMILE LYCHEE TEA","캐모마일 리치 티","BOTH",[8000,8300]],
  ["flower-tea","TEA","SEASONAL FLOWER TEA","시즌 꽃차","HOT_ONLY",[7500]],
  ["pet-tto","PET DRINK","PET-TTO LATTE","펫-또 라떼","ONE",[4000]],
].map(([id,cat,en,ko,temp,price,badge])=>({id,cat,en,ko,temp,price,badge:badge||(temp==="ICE_ONLY"||temp==="HOT_ONLY"?temp:null)}));

// sellable units: menu × temperature
const UNITS = [];
MENU.forEach(m=>{
  if(m.temp==="BOTH"){UNITS.push({key:m.id+":HOT",m,t:"HOT",price:m.price[0]});UNITS.push({key:m.id+":ICE",m,t:"ICE",price:m.price[1]});}
  else if(m.temp==="HOT_ONLY") UNITS.push({key:m.id+":HOT",m,t:"HOT",price:m.price[0]});
  else if(m.temp==="ICE_ONLY") UNITS.push({key:m.id+":ICE",m,t:"ICE",price:m.price[0]});
  else UNITS.push({key:m.id+":ONE",m,t:"ONE",price:m.price[0]});
});
const UNIT = Object.fromEntries(UNITS.map(u=>[u.key,u]));

const won = n => n.toLocaleString("ko-KR")+"원";
const $ = id => document.getElementById(id);

let state = {orders:[], seq:0};
try{ const s = JSON.parse(localStorage.getItem(STORE_KEY)||"null"); if(s && Array.isArray(s.orders)) state = s; }catch(e){}
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }

let cart = {};      // key -> qty
let tab = "전체";

const active = () => state.orders.filter(o=>!o.canceled);
const soldTotal = () => active().reduce((a,o)=>a+o.items.reduce((b,i)=>b+i.qty,0),0);
const cartQty = () => Object.values(cart).reduce((a,b)=>a+b,0);
const cartAmt = () => Object.entries(cart).reduce((a,[k,q])=>a+UNIT[k].price*q,0);
const remaining = () => LIMIT - soldTotal();

/* ---------- tabs ---------- */
function renderTabs(){
  const names = ["전체",...CATS];
  $("tabs").innerHTML = names.map(n=>{
    const c = n==="전체"?MENU.length:MENU.filter(m=>m.cat===n).length;
    return `<button class="tab" role="tab" type="button" aria-selected="${n===tab}" data-tab="${n}">${n}<span class="n">${c}</span></button>`;
  }).join("");
}
$("tabs").addEventListener("click",e=>{
  const b=e.target.closest("[data-tab]"); if(!b) return;
  tab=b.dataset.tab; renderTabs(); renderMenu(); $("main").scrollTop=0; syncRail();
});

/* ---------- menu ---------- */
const tempLabel = {HOT:"HOT",ICE:"ICE",ONE:"주문"};
function cardHTML(m){
  const units = UNITS.filter(u=>u.m===m);
  const badge = m.badge ? `<span class="badge ${m.badge}">${m.badge.replace("_"," ")}</span>` : "";
  const rows = units.map(u=>`
    <div class="row">
      <div class="t ${u.t}">${tempLabel[u.t]}<i>${(u.price/1000).toFixed(1)}</i></div>
      <div class="stepper">
        <button class="step minus" type="button" data-k="${u.key}" data-d="-1" aria-label="${m.ko} ${tempLabel[u.t]} 빼기">−</button>
        <div class="qty" data-q="${u.key}">0</div>
        <button class="step plus" type="button" data-k="${u.key}" data-d="1" aria-label="${m.ko} ${tempLabel[u.t]} 더하기">+</button>
      </div>
    </div>`).join("");
  return `<article class="card" data-card="${m.id}"><div class="head"><div class="en">${m.en}</div><div class="ko">${m.ko}</div>${badge}</div><div class="rows">${rows}</div></article>`;
}
function renderMenu(){
  const cats = tab==="전체"?CATS:[tab];
  $("main").innerHTML = cats.map(c=>`
    ${tab==="전체"?`<div class="section-label">${c}</div>`:""}
    <div class="grid">${MENU.filter(m=>m.cat===c).map(cardHTML).join("")}</div>`).join("");
  refresh();
}
$("main").addEventListener("click",e=>{
  const b=e.target.closest(".step"); if(!b||b.disabled) return;
  const k=b.dataset.k, d=+b.dataset.d;
  const cur=cart[k]||0;
  if(d>0 && cartQty()>=remaining()) return;
  const nx=Math.max(0,cur+d);
  if(nx===0) delete cart[k]; else cart[k]=nx;
  refresh();
});

/* ---------- refresh everything that depends on counts ---------- */
function refresh(){
  const rem = remaining(), cq = cartQty(), full = cq>=rem;
  document.querySelectorAll("[data-q]").forEach(el=>{
    const q=cart[el.dataset.q]||0; el.textContent=q; el.classList.toggle("pos",q>0);
  });
  document.querySelectorAll(".step").forEach(b=>{
    const q=cart[b.dataset.k]||0;
    b.disabled = b.dataset.d==="-1" ? q===0 : full;
  });
  document.querySelectorAll("[data-card]").forEach(c=>{
    c.classList.toggle("on", UNITS.some(u=>u.m.id===c.dataset.card && cart[u.key]));
  });
  $("cartSum").innerHTML = cq ? `장바구니 <b>${cq}</b>잔<span class="won">${won(cartAmt())}</span>` : `메뉴를 골라 주세요`;
  $("orderBtn").disabled = cq===0;
  $("clearCart").disabled = cq===0;
  const sold = soldTotal();
  $("count").innerHTML = `${sold}<span>/${LIMIT}</span>`;
  $("meter").querySelector("i").style.width = Math.min(100,sold/LIMIT*100)+"%";
  $("meter").classList.toggle("near", rem<=50);
  $("remain").textContent = rem;
  $("remainAfter").textContent = cq ? `주문 후 ${rem-cq}잔` : "";
  $("remainBox").classList.toggle("alert", rem<=50);
  $("soldout").hidden = rem>0;
}
$("clearCart").addEventListener("click",()=>{cart={};refresh();});

/* ---------- order ---------- */
const sortedCart = () => UNITS.filter(u=>cart[u.key]).map(u=>({u,q:cart[u.key]}));
$("orderBtn").addEventListener("click",()=>{

function aggregate(){
  const agg = Object.fromEntries(UNITS.map(u=>[u.key,{qty:0,amt:0}]));
  active().forEach(o=>o.items.forEach(i=>{ if(agg[i.key]){agg[i.key].qty+=i.qty;agg[i.key].amt+=i.qty*i.price;} }));
  return agg;
}
const selected=new Set();
function openReport(){ selected.clear(); renderReport(); $("report").hidden=false; }
function renderReport(){
  const agg=aggregate();
  const sold=soldTotal(); const rev=Object.values(agg).reduce((a,x)=>a+x.amt,0);
  let rows="";
  CATS.forEach(c=>{
    const us=UNITS.filter(u=>u.m.cat===c);
    const cq=us.reduce((a,u)=>a+agg[u.key].qty,0), ca=us.reduce((a,u)=>a+agg[u.key].amt,0);
    rows+=`<tr class="cat"><td>${c}</td><td></td><td></td><td>${cq}잔</td><td>${won(ca)}</td></tr>`;
    us.forEach(u=>{const a=agg[u.key];rows+=`<tr class="${a.qty?"":"zero"}"><td>${u.m.ko}</td><td>${u.t==="ONE"?"-":u.t}</td><td>${won(u.price)}</td><td>${a.qty}</td><td>${won(a.amt)}</td></tr>`;});
  });
  const fmt = ts => new Date(ts).toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"});
  const orders = active().slice().reverse().map(o=>{
    const n=o.items.reduce((a,i)=>a+i.qty,0), amt=o.items.reduce((a,i)=>a+i.qty*i.price,0);
    const desc=o.items.map(i=>{const u=UNIT[i.key];return `${u?u.m.ko:i.key}${u&&u.t!=="ONE"?"("+u.t+")":""}×${i.qty}`;}).join(", ");
    const on=selected.has(o.no);
    return `<tr class="pick${on?" sel":""}" data-no="${o.no}"><td class="ck"><span class="chk${on?" on":""}" role="checkbox" aria-checked="${on}" aria-label="${o.no}번 주문 선택"></span></td><td>${o.no}</td><td>${fmt(o.ts)}</td><td style="text-align:left;white-space:normal">${desc}</td><td>${n}</td><td>${won(amt)}</td></tr>`;
  }).join("") || `<tr><td colspan="6" style="text-align:center;color:#B9A396">아직 주문이 없어요</td></tr>`;
  $("rpBody").innerHTML = `
    <div class="report-top">
      <div class="stat"><small>판매 잔 수</small><b>${sold} / ${LIMIT}</b></div>
      <div class="stat"><small>총 매출</small><b>${won(rev)}</b></div>
      <div class="stat"><small>주문 건수</small><b>${active().length}건</b></div>
      <div class="stat"><small>남은 잔</small><b>${remaining()}</b></div>
    </div>
    <div class="tbl-wrap"><table><thead><tr><th>메뉴</th><th>온도</th><th>단가</th><th>수량</th><th>매출</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="subhead">주문 내역 <small>취소할 주문을 눌러 체크한 뒤 아래 '선택 주문 취소'를 누르세요</small></div>
    <div class="tbl-wrap"><table class="orders"><thead><tr><th class="ck"></th><th>번호</th><th>시각</th><th style="text-align:left">품목</th><th>잔</th><th>금액</th></tr></thead><tbody>${orders}</tbody></table></div>
    <p class="note">데이터는 이 태블릿 브라우저에 자동 저장됩니다. 행사 중간중간 엑셀 저장으로 백업해 두세요.</p>`;
  updateCancelBtn();

function updateCancelBtn(){

$("rpBody").addEventListener("click",e=>{
  const tr=e.target.closest("tr.pick"); if(!tr) return;

/* ---------- Excel (.xlsx) export: minimal writer, no library, works offline ---------- */
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRC_T[(c^u8[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function zipStore(files){ // files: [{name, data:string}]
  const enc=new TextEncoder(), parts=[], central=[]; let off=0;
  const d=new Date(), dt=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1)), dd=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate());
  for(const f of files){
    const name=enc.encode(f.name), data=enc.encode(f.data), crc=crc32(data);
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);
    h.setUint16(10,dt,true);h.setUint16(12,dd,true);h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);
    h.setUint16(26,name.length,true);h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer),name,data);
    const cd=new DataView(new ArrayBuffer(46));
    cd.setUint32(0,0x02014b50,true);cd.setUint16(4,20,true);cd.setUint16(6,20,true);cd.setUint16(8,0x0800,true);cd.setUint16(10,0,true);
    cd.setUint16(12,dt,true);cd.setUint16(14,dd,true);cd.setUint32(16,crc,true);cd.setUint32(20,data.length,true);cd.setUint32(24,data.length,true);
    cd.setUint16(28,name.length,true);cd.setUint32(42,off,true);
    central.push(new Uint8Array(cd.buffer),name);
    off+=30+name.length+data.length;
  }
  const cdSize=central.reduce((a,p)=>a+p.length,0);
  const e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cdSize,true);e.setUint32(16,off,true);
  return new Blob([...parts,...central,new Uint8Array(e.buffer)],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
const xesc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function colName(i){let s="";i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26);}return s;}
// cell: string | number | {v, s} ; style ids: 0 normal, 1 bold header, 2 #,##0, 3 bold #,##0, 4 bold text
function sheetXML(rows, widths){
  const cols = widths ? `<cols>${widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join("")}</cols>` : "";
  const body = rows.map((r,ri)=>`<row r="${ri+1}">${r.map((cell,ci)=>{
    if(cell===null||cell===undefined||cell==="") return "";
    const c = (typeof cell==="object") ? cell : {v:cell};
    const ref=colName(ci)+(ri+1);
    const s = c.s!==undefined ? c.s : (typeof c.v==="number" ? 2 : 0);
    if(typeof c.v==="number") return `<c r="${ref}" s="${s}"><v>${c.v}</v></c>`;
    return `<c r="${ref}" s="${s}" t="inlineStr"><is><t xml:space="preserve">${xesc(c.v)}</t></is></c>`;
  }).join("")}</row>`).join("");
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>${cols}<sheetData>${body}</sheetData></worksheet>`;
}
function buildXLSX(){
  const agg=aggregate();
  const H=t=>({v:t,s:1});
  const s1=[[H("카테고리"),H("메뉴"),H("영문명"),H("온도"),H("단가"),H("수량"),H("매출")]];
  UNITS.forEach(u=>{const a=agg[u.key];if(!a.qty) return;s1.push([u.m.cat,u.m.ko,u.m.en,u.t==="ONE"?"-":u.t,u.price,a.qty,a.amt]);});
  const rev=Object.values(agg).reduce((a,x)=>a+x.amt,0);
  s1.push([{v:"합계",s:4},"","","","",{v:soldTotal(),s:3},{v:rev,s:3}]);
  const s2=[[H("주문번호"),H("시각"),H("메뉴"),H("온도"),H("수량"),H("단가"),H("금액"),H("상태")]];
  state.orders.forEach(o=>o.items.forEach(i=>{const u=UNIT[i.key];s2.push([o.no,new Date(o.ts).toLocaleString("ko-KR"),u?u.m.ko:i.key,u?(u.t==="ONE"?"-":u.t):"",i.qty,i.price,i.qty*i.price,o.canceled?"취소":"정상"]);}));
  const sheets=[["메뉴별 집계",s1,[12,20,28,8,10,8,12]],["주문 내역",s2,[10,24,20,8,8,10,12,8]]];
  const files=[
    {name:"[Content_Types].xml",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")}</Types>`},
    {name:"_rels/.rels",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`},
    {name:"xl/workbook.xml",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s,i)=>`<sheet name="${xesc(s[0])}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join("")}</sheets></workbook>`},
    {name:"xl/_rels/workbook.xml.rels",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((_,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join("")}<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`},
    {name:"xl/styles.xml",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="맑은 고딕"/></font><font><b/><sz val="11"/><name val="맑은 고딕"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFFFE6D6"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="5"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/><xf numFmtId="3" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="3" fontId="1" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyFont="1"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`},
    ...sheets.map((s,i)=>({name:`xl/worksheets/sheet${i+1}.xml`,data:sheetXML(s[1],s[2])})),
  ];
  return zipStore(files);
}
function xlsxName(){const d=new Date(),p=n=>String(n).padStart(2,"0");return `pearlday_drinks_${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}.xlsx`;}

/* fullscreen toggle (hidden where the browser can't do it, or when already launched full screen) */
const fsEl=document.documentElement;
const fsReq=fsEl.requestFullscreen||fsEl.webkitRequestFullscreen;
const fsExit=document.exitFullscreen||document.webkitExitFullscreen;
const fsNow=()=>document.fullscreenElement||document.webkitFullscreenElement;
const launchedFull=()=>{try{return matchMedia("(display-mode: fullscreen)").matches;}catch(e){return false;}};
function fsSync(){
  const on=!!fsNow();
  $("fsBtn").hidden=!fsReq||(launchedFull()&&!on);
  $("fsLabel").textContent=on?"전체화면 해제":"전체화면";
  $("fsIcon").setAttribute("d",on?"M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5":"M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5");
  setTimeout(()=>{try{syncRail();}catch(e){}},120);
}
$("fsBtn").addEventListener("click",()=>{
  try{
    const p=fsNow()?fsExit.call(document):fsReq.call(fsEl,{navigationUI:"hide"});
    if(p&&p.catch) p.catch(()=>toast("이 브라우저에서는 전체화면을 쓸 수 없어요"));
  }catch(e){ toast("이 브라우저에서는 전체화면을 쓸 수 없어요"); }
});
document.addEventListener("fullscreenchange",fsSync);
document.addEventListener("webkitfullscreenchange",fsSync);
fsSync();

/* keep tablet awake */
async function wake(){try{if(navigator.wakeLock) await navigator.wakeLock.request("screen");}catch(e){}}
wake(); document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible") wake();});

/* custom scroll rail */
const mainEl=$("main"), track=$("track"), thumb=$("thumb");
function syncRail(){
  const max=mainEl.scrollHeight-mainEl.clientHeight;
  const off=max<=2;
  $("rail").classList.toggle("off",off);
  const th=Math.max(56, track.clientHeight*Math.min(1,mainEl.clientHeight/mainEl.scrollHeight));
  thumb.style.height=th+"px";
  thumb.style.top=(off?0:(track.clientHeight-th)*(mainEl.scrollTop/max))+"px";
  $("scrollUp").disabled=off||mainEl.scrollTop<=2;
  $("scrollDown").disabled=off||mainEl.scrollTop>=max-2;
  $("fade").classList.toggle("gone",off||mainEl.scrollTop>=max-2);
}
mainEl.addEventListener("scroll",syncRail,{passive:true});
window.addEventListener("resize",syncRail);
const page=d=>mainEl.scrollBy({top:d*mainEl.clientHeight*0.75,behavior:"smooth"});
$("scrollUp").addEventListener("click",()=>page(-1));
$("scrollDown").addEventListener("click",()=>page(1));
function scrollToY(clientY,grabOffset){
  const r=track.getBoundingClientRect(), th=thumb.offsetHeight;
  const p=Math.max(0,Math.min(1,(clientY-r.top-grabOffset)/(r.height-th)));
  mainEl.scrollTop=p*(mainEl.scrollHeight-mainEl.clientHeight);
}
let grab=null;
thumb.addEventListener("pointerdown",e=>{e.preventDefault();e.stopPropagation();grab=e.clientY-thumb.getBoundingClientRect().top;thumb.classList.add("drag");thumb.setPointerCapture(e.pointerId);});
thumb.addEventListener("pointermove",e=>{if(grab!==null) scrollToY(e.clientY,grab);});
const endDrag=()=>{grab=null;thumb.classList.remove("drag");};
thumb.addEventListener("pointerup",endDrag);thumb.addEventListener("pointercancel",endDrag);
track.addEventListener("pointerdown",e=>{if(e.target===thumb) return;scrollToY(e.clientY,thumb.offsetHeight/2);});

renderTabs(); renderMenu(); syncRail();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(syncRail);
})();

<script>
/* offline cache + keep stored orders from being evicted */
(function(){
  if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){
    window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){});});
  }
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  document.addEventListener('gesturestart',function(e){e.preventDefault();});
})();
</script>
</body>
</html>
